name: CI

on:
  push:
  pull_request:

jobs:
  gate:
    name: Offline gate (just check + check docs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: gatekeeper

      - name: Install just + typos
        uses: taiki-e/install-action@v2
        with:
          tool: just,typos

      - name: Install shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y shellcheck

      - name: Offline gate (fmt-check, lint, test, shell, typos, docs)
        run: just check

      - name: Docs-coverage lint (gatekeeper check docs)
        run: cargo run --manifest-path gatekeeper/Cargo.toml --quiet -- check docs

      - name: README/USER-GUIDE↔help sync (cli_doc_sync)
        run: cargo test --manifest-path gatekeeper/Cargo.toml --test cli_doc_sync

  installer:
    name: Offline installer tests (test-payload, test-fetch, test-e2e)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: gatekeeper

      - name: Install just
        uses: taiki-e/install-action@v2
        with:
          tool: just

      - name: Install shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y shellcheck

      - name: Offline installer test suite
        run: just test-payload && just test-fetch && just test-e2e

  network:
    name: Network gates (deny, links) — non-blocking
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: gatekeeper

      - name: Install just + cargo-deny + lychee
        uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-deny,lychee

      - name: just deny
        run: just deny

      - name: just links
        run: just links
