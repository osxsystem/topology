[package]
name = "gatekeeper"
version = "0.1.0"
edition = "2021"
description = "Topology gate-enforcement engine: routes skills and checks methodology gates."
license = "MIT"

[dependencies]
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

[[bin]]
name = "gatekeeper"
path = "src/main.rs"

[profile.release]
opt-level = "z"
lto = true
strip = true
