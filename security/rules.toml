schema_version = 2

# ---------- content rules (scanned on every input: files, command strings, blobs) ----------
[[rule]]
id = "aws-access-key-id"
kind = "content"
severity = "block"
description = "AWS access key id"
pattern = '\b(AKIA|ASIA)[0-9A-Z]{16}\b'

[[rule]]
id = "aws-secret-access-key"
kind = "content"
severity = "block"
# Matches a 'secret…key'-named assignment ('=' or ':', optional quote) followed by a
# 40+-char base64-ish value. 40 is the canonical AWS secret length; longer values are
# blocked conservatively, shorter ones are not matched.
description = "AWS secret access key assignment"
pattern = '(?i)\b(?:aws[_-])?secret[_-](?:access[_-])?key\s*[=:]\s*[\x22\x27]?[A-Za-z0-9/+=]{40,}'

[[rule]]
id = "private-key-block"
kind = "content"
severity = "block"
description = "PEM private key header"
pattern = '-----BEGIN (RSA |EC |DSA |OPENSSH |PGP )?PRIVATE KEY-----'

[[rule]]
id = "gcp-service-account"
kind = "content"
severity = "block"
description = "GCP service-account private-key marker"
pattern = '"type"\s*:\s*"service_account"'

[[rule]]
id = "github-token"
kind = "content"
severity = "block"
description = "GitHub token prefix"
pattern = '\bgh[pousr]_[A-Za-z0-9]{20,}\b'

[[rule]]
id = "slack-token"
kind = "content"
severity = "block"
description = "Slack token prefix"
pattern = '\bxox[baprs]-[A-Za-z0-9-]{10,}\b'

[[rule]]
id = "openai-key"
kind = "content"
severity = "block"
description = "sk-prefixed provider key, hyphenated segments tolerated (sk-proj-…, sk-ant-…)"
pattern = '\bsk-(?:[A-Za-z0-9_]+-)*[A-Za-z0-9_]{20,}\b'

[[rule]]
id = "jwt-structural"
kind = "content"
severity = "block"
description = "JWT — three dot-joined base64url segments with the eyJ sigil"
pattern = '\beyJ[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]{8,}\b'

[[rule]]
id = "labeled-secret-assignment"
kind = "content"
severity = "warn"
description = "credential-labeled assignment (api key / auth token / password / bearer)"
pattern = '(?i)\b(?:api[_-]?key|auth[_-]?token|password|passwd|bearer)\s*[=:]\s*[\x22\x27]?[A-Za-z0-9+/=_-]{16,}'

# ---------- entropy rules (schema v2; unlabeled high-entropy secrets — FM5) ----------
# Shipped severity = "warn" (shadow): emitted but never block. Entropy cannot distinguish a
# genuine secret from a benign high-entropy blob (git OID, lockfile hash, base64 vector), so
# false positives are bounded by `[scan] exclude_paths` (path-bearing lanes) and a burn-in FP
# measurement precedes any promotion to "block". Thresholds are the detect-secrets lineage.
[[rule]]
id = "hex-high-entropy"
kind = "entropy"
severity = "warn"
description = "high-entropy hex run (unlabeled secret candidate)"
charset = "hex"
min_length = 32
threshold_bits_per_char = 3.0

[[rule]]
id = "base64-high-entropy"
kind = "entropy"
severity = "warn"
description = "high-entropy base64 run (unlabeled secret candidate)"
charset = "base64"
min_length = 20
threshold_bits_per_char = 4.5

# ---------- command rules (scanned only on shell-command inputs: --cmd, --hook Bash) ----------
[[rule]]
id = "rm-rf-root"
kind = "command"
severity = "block"
description = "recursive force-delete of the filesystem root"
pattern = '\brm\s+((-{1,2}[A-Za-z0-9][\w-]*|--)\s+)*-[A-Za-z]*[rR][A-Za-z]*f[A-Za-z]*\s+([^\s;|&]+\s+)*/(\*|\s|[;&|<>)]|$)'

[[rule]]
id = "rm-rf-root-fr"
kind = "command"
severity = "block"
description = "recursive force-delete of the filesystem root (f before r)"
pattern = '\brm\s+((-{1,2}[A-Za-z0-9][\w-]*|--)\s+)*-[A-Za-z]*f[A-Za-z]*[rR][A-Za-z]*\s+([^\s;|&]+\s+)*/(\*|\s|[;&|<>)]|$)'

[[rule]]
id = "rm-rf-root-split-rf"
kind = "command"
severity = "block"
description = "recursive force-delete of root with separated/long flags (recursive then force)"
pattern = '\brm\s+((-{1,2}[A-Za-z0-9][\w-]*|--)\s+)*(--recursive|-[A-Za-z]*[rR][A-Za-z]*)\s+((-{1,2}[A-Za-z0-9][\w-]*|--)\s+)*(--force|-[A-Za-z]*f[A-Za-z]*)\s+([^\s;|&]+\s+)*/(\*|\s|[;&|<>)]|$)'

[[rule]]
id = "rm-rf-root-split-fr"
kind = "command"
severity = "block"
description = "recursive force-delete of root with separated/long flags (force then recursive)"
pattern = '\brm\s+((-{1,2}[A-Za-z0-9][\w-]*|--)\s+)*(--force|-[A-Za-z]*f[A-Za-z]*)\s+((-{1,2}[A-Za-z0-9][\w-]*|--)\s+)*(--recursive|-[A-Za-z]*[rR][A-Za-z]*)\s+([^\s;|&]+\s+)*/(\*|\s|[;&|<>)]|$)'

[[rule]]
id = "curl-pipe-shell"
kind = "command"
severity = "block"
description = "piping a network download straight into a shell"
pattern = '\b(curl|wget)\b[^|]*\|\s*(sudo\s+)?(\S*/)?(sh|bash|zsh)\b'

[[rule]]
id = "git-reset-hard"
kind = "command"
severity = "block"
description = "discarding work with git reset --hard"
pattern = '\bgit\b.*\breset\b.*--hard\b'

[[rule]]
id = "git-clean-fdx"
kind = "command"
severity = "block"
description = "git clean force-wiping untracked files (any flag order: -fd, -df, -dfx, --force)"
pattern = '\bgit\b.*\bclean\b.*(-[a-zA-Z]*f|--force)'

[[rule]]
id = "git-filter-branch"
kind = "command"
severity = "block"
description = "history rewrite via git filter-branch"
pattern = '\bgit\b.*\bfilter-branch\b'

[[rule]]
id = "git-push-force"
kind = "command"
severity = "block"
description = "force push (use --force-with-lease instead); incl. bundled short flags like -uf"
pattern = '\bgit\b.*\bpush\b.*(--force($|\s|[;&|<>)])|\s-[A-Za-z]*f[A-Za-z]*(\s|[;&|<>)]|$))'

[[rule]]
id = "git-commit-no-verify"
kind = "command"
severity = "block"
description = "bypassing the pre-commit safety floor (incl. bundled short flags like -nm)"
pattern = '\bgit\b.*\bcommit\b.*(--no-verify|\s-[A-Za-z]*n[A-Za-z]*(\s|[;&|<>)]|$))'

[[rule]]
id = "tamper-security-wiring"
kind = "command"
severity = "block"
description = "a Bash command mutating the security hooks, rules, scanner, or settings wiring"
pattern = '(>>?|\btee\b|\bcp\b|\bmv\b|\bln\b|\bchmod\b|\brm\b|\bdd\b|\binstall\b|\btruncate\b|sed\s+-[A-Za-z]*i)[^\n]*(\.git/hooks/|hooks/(pre-commit|security-scan)\.sh|security/rules\.toml|gatekeeper/(src/|Cargo\.)|\.claude/settings)'

# Heuristic: flags a shell command that WRITES into the memory handoff directories — a redirect
# (`>`/`>>`) or a mutating verb (tee/cp/mv/ln/chmod/rm/dd/install/truncate/sed -i), mirroring
# tamper-security-wiring. Covers both the framework-repo path (docs/memory/) and the governed-project
# path (.claude/topology/memory/). The tool guard only sees Write/Edit/MultiEdit; this catches the
# obvious shell vectors that bypass it. It RAISES — does not close — the residual: an
# indirectly-built path (variable/heredoc) or an interpreter write (`python -c …`) still evades
# this regex. Treat a finding as a prompt for review.
[[rule]]
id = "tamper-memory-artifacts"
kind = "command"
severity = "block"
description = "heuristic: a shell command writing into docs/memory/ or .claude/topology/memory/ (redirect/tee/cp/mv/rm/…) — bypasses the tool guard; raises, does not close, the residual (built paths and interpreter writes still evade it)"
pattern = '(>>?|\btee\b|\bcp\b|\bmv\b|\bln\b|\bchmod\b|\brm\b|\bdd\b|\binstall\b|\btruncate\b|sed\s+-[A-Za-z]*i)[^\n]*(docs/memory/|\.claude/topology/memory/)'

# ---------- span-scoped allowlist (exempts the matched span, never the whole line) ----------
[[allow]]
rule = "aws-access-key-id"
value = "AKIAIOSFODNN7EXAMPLE"
reason = "canonical AWS documentation example key"

[[allow]]
rule = "aws-secret-access-key"
pattern = '(?i)(?:aws[_-])?secret[_-](?:access[_-])?key\s*[=:]\s*[\x22\x27]?wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY[\x22\x27]?'
reason = "canonical AWS documentation example secret key (from AWS docs getting-started examples)"

# ---------- unscannable-blob allowlist (path + git object id; example only) ----------
# [[allow_blob]]
# path = "assets/model.bin"
# blob_oid = "<git hash-object output>"
# reason = "known-safe large binary asset"

# ---------- self-protection: staged changes to these abort the commit ----------
[integrity]
protected_paths = [
  "security/rules.toml",
  "hooks/security-scan.sh",
  "hooks/pre-commit.sh",
  "gatekeeper/src/scan.rs",
  "gatekeeper/src/main.rs",
  "gatekeeper/Cargo.toml",
  "gatekeeper/Cargo.lock",
  "scripts/install.sh",
  ".claude/settings.json",
  ".claude/settings.local.json",
  ".git/hooks/pre-commit",
]

# Directory-prefix entries for handoff artifacts (ADR-0013).
# Resolved against the ARTIFACTS root at runtime, not the framework root, so the single entry
# "memory" covers both layouts without over-protecting an unrelated docs/memory/ in a governed
# project:
#   framework repo (project == framework):  artifacts_root = <project>/docs     → docs/memory
#   governed project (project != framework): artifacts_root = <project>/.claude/topology → .claude/topology/memory
# is_protected uses Path::starts_with (component-wise), so memory-evil/ is NOT matched.
protected_artifact_paths = ["memory"]

# ---------- scanner config (schema v2) ----------
# Paths whose ENTROPY-lane findings are suppressed (regex/labeled rules always run). Applied only
# on path-bearing lanes (--staged, --hook); --content/--cmd have no path so excludes don't apply.
# These globs cover high-entropy-but-benign content that would otherwise generate shadow-warn noise.
[scan]
exclude_paths = ["*.lock", "*.svg", "*.min.js", "tests/fixtures/"]
